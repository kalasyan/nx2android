# Brings shirai91/nx2android's main into this fork's main every day, keeping the fork's own commits (the shared data folder and these workflows) on top.
# A merge that conflicts is left undone and reported as an issue; a merge that brings changes builds a new nx2android.exe (build-exe.yml).
name: Sync upstream
on:
  schedule: [{cron: '17 5 * * *'}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - id: merge
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/shirai91/nx2android.git
          git fetch --tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then echo 'already up to date'; echo changed=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git merge --no-edit -m "Merge shirai91/nx2android $(git rev-parse --short upstream/main)" upstream/main; then
            files=$(git diff --name-only --diff-filter=U); git merge --abort
            gh issue create --title "Sync upstream: conflict with shirai91/nx2android $(git rev-parse --short upstream/main)" \
              --body "The daily merge of upstream main conflicts in:"$'\n\n'"$files"$'\n\n'"Resolve it by hand (git merge upstream/main) and push to main."
            exit 1
          fi
          git push origin main
          git push origin --tags || true
          echo changed=true >> "$GITHUB_OUTPUT"
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/build-exe.yml
    permissions: {contents: write}
