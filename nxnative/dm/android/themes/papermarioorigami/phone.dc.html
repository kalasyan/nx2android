<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Mario: The Origami King — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#d9b98a}
a{color:#2b2140}a:hover{color:#2b2140}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #2b2140;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 915px; height: 412px; overflow: hidden; background: #d9b98a; font-family: 'Fredoka', sans-serif; color: #2b2140; touch-action: none; user-select: none; -webkit-user-select: none">

<!-- Backdrop -->
<svg aria-hidden="true" width="915" height="412" viewBox="0 0 915 412" style="position: absolute; left: 0; top: 0">
<polygon points="0,0 320,0 165,185" fill="#e4c79b"></polygon>
<polygon points="915,0 595,0 750,185" fill="#cfae7c"></polygon>
<polygon points="0,412 274,412 110,227" fill="#cfae7c"></polygon>
<polygon points="915,412 640,412 805,227" fill="#e4c79b"></polygon>
<line x1="0" y1="0" x2="915" y2="412" stroke="#c9a46f" stroke-width="1.5" stroke-dasharray="8 8"></line>
<line x1="915" y1="0" x2="0" y2="412" stroke="#c9a46f" stroke-width="1.5" stroke-dasharray="8 8"></line>
<path d="M274 0 Q285 26 271 48 T278 74" fill="none" stroke="#ff6f61" stroke-width="4" stroke-linecap="round"></path>
<path d="M348 0 Q358 37 344 70 T351 107" fill="none" stroke="#2ab3a6" stroke-width="4" stroke-linecap="round"></path>
<path d="M421 0 Q432 49 417 91 T425 140" fill="none" stroke="#ffc53d" stroke-width="4" stroke-linecap="round"></path>
<path d="M494 0 Q505 26 490 48 T498 74" fill="none" stroke="#7b5cd6" stroke-width="4" stroke-linecap="round"></path>
<path d="M567 0 Q578 37 564 70 T571 107" fill="none" stroke="#ff6f61" stroke-width="4" stroke-linecap="round"></path>
<path d="M640 0 Q651 49 637 91 T644 140" fill="none" stroke="#2ab3a6" stroke-width="4" stroke-linecap="round"></path>
<polygon points="314,272 329,268 333,275" fill="#ff6f61" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"></polygon><polygon points="329,268 334,258 333,275" fill="#fffaf0" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"></polygon><polygon points="333,275 345,270 347,265 341,273" fill="#ff6f61" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"></polygon>
<polygon points="537,305 549,302 551,307" fill="#2ab3a6" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"></polygon><polygon points="549,302 553,294 551,307" fill="#fffaf0" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"></polygon><polygon points="551,307 561,304 563,299 558,306" fill="#2ab3a6" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"></polygon>
<polygon points="0,412 0,406 14,402 28,406 42,402 56,406 70,402 84,406 98,402 112,406 126,402 140,406 154,402 168,406 182,402 196,406 210,402 224,406 238,402 252,406 266,402 280,406 294,402 308,406 322,402 336,406 350,402 364,406 378,402 392,406 406,402 420,406 434,402 448,406 462,402 476,406 490,402 504,406 518,402 532,406 546,402 560,406 574,402 588,406 602,402 616,406 630,402 644,406 658,402 672,406 686,402 700,406 714,402 728,406 742,402 756,406 770,402 784,406 798,402 812,406 826,402 840,406 854,402 868,406 882,402 896,406 910,402 924,406 938,402 915,412" fill="#fffaf0" stroke="#2b2140" stroke-width="1.5"></polygon>
</svg>

<!-- Full-screen game placeholder -->
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<span style="font-family: 'Baloo 2', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 5px; color: #2b2140; opacity: 0.8">[ FULL-SCREEN GAME ]</span>
</div>
<sc-if value="{{showZones}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="915" height="412" viewBox="0 0 915 412" style="position: absolute; left: 0; top: 0">
<circle cx="24" cy="372" r="175" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="150"></circle><circle cx="24" cy="372" r="290" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="80"></circle><circle cx="24" cy="372" r="250" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="24" cy="372" r="330" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle><circle cx="891" cy="372" r="175" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="150"></circle><circle cx="891" cy="372" r="290" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="80"></circle><circle cx="891" cy="372" r="250" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="891" cy="372" r="330" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle>
</svg>
</sc-if>

<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 330px; top: 40px; width: 255px; height: 48px; box-sizing: border-box; padding: 3px 14px; border: 2.5px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 4px 5px 0 #2b2140; display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Fredoka', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #2b2140">INPUT</span>
<span style="font-family: 'Fredoka', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #2b2140">FOLDS ×{{stokes}}</span>
</div>
<span style="font-family: 'Baloo 2', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 1px; line-height: 21px; white-space: nowrap; overflow: hidden; color: #d6453a">{{last}}</span>
</div>

<!-- Emulator settings: small oval, drag to move, tap to open -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 425px; top: 2px; width: 64px; height: 36px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 7px; top: 7px; width: 50px; height: 22px; box-sizing: border-box; border: 2px solid #2b2140; border-radius: 999px; background: #fffaf0; box-shadow: 2px 3px 0 #2b2140; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 3px"><span style="display: block; width: 18px; height: 2px; border-radius: 2px; background: #2b2140"></span><span style="display: block; width: 18px; height: 2px; border-radius: 2px; background: #2b2140"></span><span style="display: block; width: 18px; height: 2px; border-radius: 2px; background: #2b2140"></span></span>
</span>
</button>

<!-- System buttons (small, out of the thumb's hot zone) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 282px; top: 10px; width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 7px; top: 7px; width: 26px; height: 26px; box-sizing: border-box; border: 2px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 2px 3px 0 #2b2140; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #2b2140; font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.MINUS.g}}"></span>
<span style="position: relative; margin-top: 2px">−</span>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 593px; top: 10px; width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">
<span style="position: absolute; left: 7px; top: 7px; width: 26px; height: 26px; box-sizing: border-box; border: 2px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 2px 3px 0 #2b2140; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #2b2140; font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.PLUS.g}}"></span>
<span style="position: relative; margin-top: 2px">+</span>
</span>
</button>

<!-- Shoulders: on the thumb arc, above each cluster -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 16px; top: 104px; width: 96px; height: 50px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #2ab3a6; box-shadow: 4px 5px 0 #2b2140; color: #fffaf0; font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: 1px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZL.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 50%; background: rgba(255,255,255,0.18)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZL.g}}"></span>
<span style="position: relative; ">ZL</span>
</button>
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 120px; top: 104px; width: 108px; height: 50px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #ff6f61; box-shadow: 4px 5px 0 #2b2140; color: #fffaf0; font-family: 'Baloo 2', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 1px; cursor: pointer; overflow: hidden; transform: translateY({{p.L.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 50%; background: rgba(255,255,255,0.18)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L.g}}"></span>
<span style="position: relative; ">L</span>
</button>
<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 803px; top: 104px; width: 96px; height: 50px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #2ab3a6; box-shadow: 4px 5px 0 #2b2140; color: #fffaf0; font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: 1px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZR.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 50%; background: rgba(255,255,255,0.18)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZR.g}}"></span>
<span style="position: relative; ">ZR</span>
</button>
<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 687px; top: 104px; width: 108px; height: 50px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #ff6f61; box-shadow: 4px 5px 0 #2b2140; color: #fffaf0; font-family: 'Baloo 2', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 1px; cursor: pointer; overflow: hidden; transform: translateY({{p.R.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 50%; background: rgba(255,255,255,0.18)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.R.g}}"></span>
<span style="position: relative; ">R</span>
</button>

<!-- Left thumb: stick at rest, D-pad inner-low, L3 beside the stick -->
<button type="button" aria-label="Left stick" onPointerDown="{{ls.h.down}}" onPointerMove="{{ls.h.move}}" onPointerUp="{{ls.h.up}}" onPointerCancel="{{ls.h.up}}" style="position: absolute; left: 50px; top: 182px; width: 160px; height: 160px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed #2b2140; opacity: 0.3"></span>
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 66%); opacity: {{ls.o}}"></span>
<svg aria-hidden="true" width="116" height="116" viewBox="0 0 120 120" style="position: absolute; left: 22px; top: 22px; transform: rotate({{ls.r}}deg)">
<polygon points="60,60 60.0,5.0 98.9,21.1" fill="#ff6f61" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 98.9,21.1 115.0,60.0" fill="#ff9e8f" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 115.0,60.0 98.9,98.9" fill="#2ab3a6" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 98.9,98.9 60.0,115.0" fill="#7fd8cf" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 60.0,115.0 21.1,98.9" fill="#ffc53d" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 21.1,98.9 5.0,60.0" fill="#ffe08a" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 5.0,60.0 21.1,21.1" fill="#7b5cd6" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60,60 21.1,21.1 60.0,5.0" fill="#b7a2f0" stroke="#2b2140" stroke-width="1"></polygon><polygon points="60.0,5.0 98.9,21.1 115.0,60.0 98.9,98.9 60.0,115.0 21.1,98.9 5.0,60.0 21.1,21.1" fill="none" stroke="#2b2140" stroke-width="3" stroke-linejoin="round"></polygon>
</svg>
<span aria-hidden="true" style="position: absolute; left: 55px; top: 55px; width: 49px; height: 49px; box-sizing: border-box; border-radius: 6px; border: 2.5px solid #2b2140; background: #fffaf0; box-shadow: 0 0 {{ls.glow}}px {{accent}}, 3px 4px 0 #2b2140; transform: translate({{ls.x}}px, {{ls.y}}px)">
<span style="position: absolute; left: 0; top: 0; width: 50%; height: 100%; background: #efe3cc"></span>
<span style="position: absolute; left: 17px; top: 17px; width: 10px; height: 10px; background: #ff6f61; transform: rotate(45deg)"></span>
</span>
</button>
<sc-if value="{{showCaptions}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 72px; top: 324px; width: 116px; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 3px; color: #2b2140">L-STICK</span>
</sc-if>
<span aria-hidden="true" style="position: absolute; left: 284px; top: 318px; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #2b2140; background: #ffc53d; transform: rotate(45deg)"></span>
<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 269px; top: 253px; width: 46px; height: 46px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 3px 4px 0 #2b2140; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.UP.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.UP.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><polygon points="11,4 19,16 3,16" fill="#2b2140"></polygon></svg>
</button>
<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 269px; top: 353px; width: 46px; height: 46px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 3px 4px 0 #2b2140; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.DOWN.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.DOWN.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><polygon points="11,18 19,6 3,6" fill="#2b2140"></polygon></svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 219px; top: 303px; width: 46px; height: 46px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 3px 4px 0 #2b2140; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.LEFT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.LEFT.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><polygon points="4,11 16,3 16,19" fill="#2b2140"></polygon></svg>
</button>
<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 319px; top: 303px; width: 46px; height: 46px; padding: 0; border: 2.5px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 3px 4px 0 #2b2140; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.RIGHT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.RIGHT.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><polygon points="18,11 6,3 6,19" fill="#2b2140"></polygon></svg>
</button>
<button type="button" aria-label="L3, left stick click" onPointerDown="{{h.L3.down}}" onPointerUp="{{h.L3.up}}" onPointerCancel="{{h.L3.up}}" onClick="{{h.L3.click}}" style="position: absolute; left: 230px; top: 178px; width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L3.y}}px)">
<span style="position: absolute; left: 6px; top: 6px; width: 31px; height: 31px; box-sizing: border-box; border: 2.5px solid #2b2140; border-radius: 4px; background: #fffaf0; box-shadow: 4px 4px 0 #2b2140; color: #2b2140; font-family: 'Baloo 2', sans-serif; font-size: 14px; font-weight: 800; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: rotate(45deg);">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 50%; height: 100%; background: rgba(255,255,255,0.22)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L3.g}}"></span>
<span style="position: relative; display: inline-block; transform: rotate(-45deg); ">L3</span>
</span>
</button>

<!-- Right thumb: A/B/X/Y at rest, right stick inner-low, R3 beside it -->
<svg aria-hidden="true" width="192" height="192" viewBox="0 0 200 200" style="position: absolute; left: 674px; top: 172px">
<polygon points="100,6 194,100 100,194 6,100" fill="#fffaf0" stroke="#2b2140" stroke-width="2" opacity="0.55"></polygon><line x1="100" y1="6" x2="100" y2="194" stroke="#c9a46f" stroke-width="1.5" stroke-dasharray="6 6"></line><line x1="6" y1="100" x2="194" y2="100" stroke="#c9a46f" stroke-width="1.5" stroke-dasharray="6 6"></line>
</svg>
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 740px; top: 184px; width: 60px; height: 60px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">
<span style="position: absolute; left: 6px; top: 6px; width: 47px; height: 47px; box-sizing: border-box; border: 2.5px solid #2b2140; border-radius: 4px; background: #2ab3a6; box-shadow: 4px 4px 0 #2b2140; color: #fffaf0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: rotate(45deg);">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 50%; height: 100%; background: rgba(255,255,255,0.22)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.X.g}}"></span>
<span style="position: relative; display: inline-block; transform: rotate(-45deg); ">X</span>
</span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffc53d","options":["#ffc53d","#ff6f61","#2ab3a6","#7b5cd6"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":915,"height":412}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 160;
    this.stickTravel = 34;
    this.state = { held: {}, last: 'UNFOLD!', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 64;
    this.menuBounds = [-425, 426, -2, 374];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#ffc53d';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.5 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 2.80).toFixed(1), glow: on ? 18 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
