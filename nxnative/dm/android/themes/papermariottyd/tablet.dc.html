<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&amp;display=swap">
<style>
body{margin:0;background:#2a2350}

button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #f2c14e;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 1216px; height: 760px; overflow: hidden; background: #2a2350; font-family: 'Nunito', sans-serif; color: #ffffff; touch-action: none; user-select: none; -webkit-user-select: none">

<!-- Backdrop -->
<svg aria-hidden="true" width="1216" height="760" viewBox="0 0 1216 760" style="position: absolute; left: 0; top: 0">
<polygon points="608,0 340,714 876,714" fill="#fff4c2" opacity="0.08"></polygon>
<polygon points="365,166 369,177 380,177 372,185 374,195 365,190 355,195 358,185 350,177 361,177" fill="#f2c14e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></polygon>
<polygon points="851,140 854,148 863,148 856,154 858,162 851,157 844,162 846,154 840,148 848,148" fill="#f2c14e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></polygon>
<polygon points="547,82 550,88 556,88 551,92 552,98 547,95 542,98 543,92 539,88 545,88" fill="#f2c14e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></polygon>
<polygon points="730,266 732,271 737,271 733,275 734,280 730,277 725,280 726,275 722,271 727,271" fill="#f2c14e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></polygon>
<path d="M0 0 H70 Q49 380 84 760 H0 Z" fill="#a3182e" stroke="#ffffff" stroke-width="3"></path>
<path d="M1216 0 H1146 Q1167 380 1132 760 H1216 Z" fill="#a3182e" stroke="#ffffff" stroke-width="3"></path>
<line x1="21" y1="0" x2="21" y2="760" stroke="#7d0f22" stroke-width="6" opacity="0.7"></line><line x1="46" y1="0" x2="46" y2="760" stroke="#7d0f22" stroke-width="6" opacity="0.7"></line><line x1="1195" y1="0" x2="1195" y2="760" stroke="#7d0f22" stroke-width="6" opacity="0.7"></line><line x1="1170" y1="0" x2="1170" y2="760" stroke="#7d0f22" stroke-width="6" opacity="0.7"></line>
<path d="M0 0 H1216 V22 Q30 44 60 22 Q90 44 120 22 Q150 44 180 22 Q210 44 240 22 Q270 44 300 22 Q330 44 360 22 Q390 44 420 22 Q450 44 480 22 Q510 44 540 22 Q570 44 600 22 Q630 44 660 22 Q690 44 720 22 Q750 44 780 22 Q810 44 840 22 Q870 44 900 22 Q930 44 960 22 Q990 44 1020 22 Q1050 44 1080 22 Q1110 44 1140 22 Q1170 44 1200 22 Q1230 44 1260 22 V0 Z" fill="#a3182e" stroke="#ffffff" stroke-width="3"></path>
<rect x="0" y="714" width="1216" height="46" fill="#8a5a33" stroke="#ffffff" stroke-width="3"></rect>
<line x1="0" y1="718" x2="0" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="80" y1="718" x2="80" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="160" y1="718" x2="160" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="240" y1="718" x2="240" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="320" y1="718" x2="320" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="400" y1="718" x2="400" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="480" y1="718" x2="480" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="560" y1="718" x2="560" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="640" y1="718" x2="640" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="720" y1="718" x2="720" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="800" y1="718" x2="800" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="880" y1="718" x2="880" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="960" y1="718" x2="960" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="1040" y1="718" x2="1040" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="1120" y1="718" x2="1120" y2="760" stroke="#6d4524" stroke-width="2"></line><line x1="1200" y1="718" x2="1200" y2="760" stroke="#6d4524" stroke-width="2"></line>
</svg>

<!-- Full-screen game placeholder -->
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<span style="font-family: 'Luckiest Guy', cursive; font-size: 18px; font-weight: 600; letter-spacing: 5px; color: #c9c2ff; opacity: 0.8">[ FULL-SCREEN GAME ]</span>
</div>
<sc-if value="{{showZones}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="1216" height="760" viewBox="0 0 1216 760" style="position: absolute; left: 0; top: 0">
<circle cx="0" cy="520" r="230" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="220"></circle><circle cx="0" cy="520" r="385" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="90"></circle><circle cx="0" cy="520" r="340" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="0" cy="520" r="430" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle><circle cx="1216" cy="520" r="230" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="220"></circle><circle cx="1216" cy="520" r="385" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="90"></circle><circle cx="1216" cy="520" r="340" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="1216" cy="520" r="430" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle>
</svg>
</sc-if>

<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 438px; top: 56px; width: 340px; height: 62px; box-sizing: border-box; padding: 7px 16px; border: 2px solid #1f1a2e; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #1f1a2e">INPUT</span>
<span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #1f1a2e">APPLAUSE ×{{stokes}}</span>
</div>
<span style="font-family: 'Luckiest Guy', cursive; font-size: 23px; font-weight: 700; letter-spacing: 1px; line-height: 27px; white-space: nowrap; overflow: hidden; color: #a3182e">{{last}}</span>
</div>

<!-- Emulator settings: small oval, drag to move, tap to open -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 570px; top: 6px; width: 76px; height: 44px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 60px; height: 28px; box-sizing: border-box; border: 2px solid #1f1a2e; border-radius: 999px; background: #ffffff; box-shadow: 3px 4px 0 rgba(0,0,0,0.45); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #1f1a2e"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #1f1a2e"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #1f1a2e"></span></span>
</span>
</button>

<!-- System buttons (small, out of the thumb's hot zone) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 40px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #1f1a2e; border-radius: 50%; background: #ffffff; box-shadow: 3px 4px 0 rgba(0,0,0,0.45); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 20px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.MINUS.g}}"></span>
<span style="position: relative; margin-top: 2px">−</span>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 1128px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #1f1a2e; border-radius: 50%; background: #ffffff; box-shadow: 3px 4px 0 rgba(0,0,0,0.45); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 20px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.PLUS.g}}"></span>
<span style="position: relative; margin-top: 2px">+</span>
</span>
</button>

<!-- Shoulders: on the thumb arc, above each cluster -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 24px; top: 250px; width: 112px; height: 56px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #f2c14e; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 23px; font-weight: 400; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZL.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZL.g}}"></span>
<span style="position: relative; ">ZL</span>
</button>
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 144px; top: 250px; width: 128px; height: 56px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #ffe08a; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 21px; font-weight: 400; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: translateY({{p.L.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L.g}}"></span>
<span style="position: relative; ">L</span>
</button>
<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 1080px; top: 250px; width: 112px; height: 56px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #f2c14e; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 23px; font-weight: 400; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZR.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZR.g}}"></span>
<span style="position: relative; ">ZR</span>
</button>
<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 944px; top: 250px; width: 128px; height: 56px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #ffe08a; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 21px; font-weight: 400; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: translateY({{p.R.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.R.g}}"></span>
<span style="position: relative; ">R</span>
</button>

<!-- Left thumb: stick at rest, D-pad inner-low, L3 beside the stick -->
<button type="button" aria-label="Left stick" onPointerDown="{{ls.h.down}}" onPointerMove="{{ls.h.move}}" onPointerUp="{{ls.h.up}}" onPointerCancel="{{ls.h.up}}" style="position: absolute; left: 68px; top: 348px; width: 184px; height: 184px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed #ffffff; opacity: 0.3"></span>
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 164px; height: 164px; border-radius: 50%; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 66%); opacity: {{ls.o}}"></span>
<svg aria-hidden="true" width="136" height="136" viewBox="0 0 120 120" style="position: absolute; left: 24px; top: 24px; transform: rotate({{ls.r}}deg)">
<circle cx="60" cy="60" r="55" fill="#2a2350" stroke="#ffffff" stroke-width="5"></circle>
<circle cx="60" cy="60" r="55" fill="none" stroke="#1f1a2e" stroke-width="1.5"></circle>
<polygon points="60,30 68,49 89,51 73,64 78,84 60,74 42,84 47,64 31,51 52,49" fill="#f2c14e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></polygon>
<circle cx="60" cy="60" r="44" fill="none" stroke="#8b7fd6" stroke-width="2" stroke-dasharray="4 6"></circle>
</svg>
<span aria-hidden="true" style="position: absolute; left: 63px; top: 63px; width: 58px; height: 58px; box-sizing: border-box; border-radius: 50%; border: 2px solid #1f1a2e; background: #a3182e; box-shadow: 0 0 0 3px #ffffff, 0 0 {{ls.glow}}px {{accent}}, 5px 6px 0 3px rgba(0,0,0,0.45); transform: translate({{ls.x}}px, {{ls.y}}px)">
<span style="position: absolute; left: 11px; top: 8px; width: 19px; height: 7px; border-radius: 99px; background: #ffffff; opacity: 0.6"></span>
</span>
</button>
<sc-if value="{{showCaptions}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 92px; top: 512px; width: 136px; text-align: center; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 3px; color: #ffffff">L-STICK</span>
</sc-if>
<span aria-hidden="true" style="position: absolute; left: 322px; top: 572px; width: 16px; height: 16px; border-radius: 50%; background: #f2c14e; box-shadow: 0 0 0 2px #ffffff"></span>
<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 303px; top: 494px; width: 54px; height: 54px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #ffffff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.UP.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.UP.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="11,4 19,16 3,16" fill="#1f1a2e"></polygon></svg>
</button>
<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 303px; top: 612px; width: 54px; height: 54px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #ffffff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.DOWN.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.DOWN.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="11,18 19,6 3,6" fill="#1f1a2e"></polygon></svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 244px; top: 553px; width: 54px; height: 54px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #ffffff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.LEFT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.LEFT.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="4,11 16,3 16,19" fill="#1f1a2e"></polygon></svg>
</button>
<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 362px; top: 553px; width: 54px; height: 54px; padding: 0; border: 2px solid #1f1a2e; border-radius: 10px; background: #ffffff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.RIGHT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.RIGHT.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="18,11 6,3 6,19" fill="#1f1a2e"></polygon></svg>
</button>
<button type="button" aria-label="L3, left stick click" onPointerDown="{{h.L3.down}}" onPointerUp="{{h.L3.up}}" onPointerCancel="{{h.L3.up}}" onClick="{{h.L3.click}}" style="position: absolute; left: 276px; top: 360px; width: 52px; height: 52px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L3.y}}px)">
<span style="position: absolute; left: 3px; top: 3px; width: 46px; height: 46px; box-sizing: border-box; border: 2px solid #1f1a2e; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 17px; font-weight: 400; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; left: 22%; top: 5px; width: 30%; height: 4px; border-radius: 99px; background: #ffffff; opacity: 0.55"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L3.g}}"></span>
<span style="position: relative; ">L3</span>
</span>
</button>

<!-- Right thumb: A/B/X/Y at rest, right stick inner-low, R3 beside it -->
<svg aria-hidden="true" width="228" height="228" viewBox="0 0 200 200" style="position: absolute; left: 932px; top: 316px">
<circle cx="100" cy="100" r="93" fill="none" stroke="#f2c14e" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round" opacity="0.7"></circle>
</svg>
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 1012px; top: 334px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 68px; height: 68px; box-sizing: border-box; border: 2px solid #1f1a2e; border-radius: 50%; background: #4a8cff; box-shadow: 0 0 0 3px #ffffff, 5px 6px 0 3px rgba(0,0,0,0.45); color: #1f1a2e; font-family: 'Luckiest Guy', cursive; font-size: 29px; font-weight: 400; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; left: 22%; top: 7px; width: 30%; height: 6px; border-radius: 99px; background: #ffffff; opacity: 0.55"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.X.g}}"></span>
<span style="position: relative; ">X</span>
</span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f2c14e","options":["#f2c14e","#ff5d7a","#5fd0ff","#8be36b"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":1216,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 184;
    this.stickTravel = 39;
    this.state = { held: {}, last: 'CURTAIN UP!', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 76;
    this.menuBounds = [-570, 570, -6, 710];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#f2c14e';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.5 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 1.40).toFixed(1), glow: on ? 22 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
